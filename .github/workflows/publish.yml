name: Publish package
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing (OIDC), also generates the provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          require-lockfile: true
      # Release tag `v1.2.3` publishes 1.2.3 on `latest`, `v1.2.3-beta.1` on `next`.
      - name: Set version from release tag
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          pnpm version "$version" --no-git-tag-version --no-git-checks
          if [[ "$version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build library
        run: pnpm run build-lib
      # npm CLI (bundled with Node 26) handles the OIDC token exchange.
      - name: Publish
        run: npm publish --tag "${{ steps.version.outputs.dist-tag }}"
